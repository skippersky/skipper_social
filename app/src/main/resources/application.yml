spring:
  application:
    name: kili-social

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

kili:
  social:
    default-connect-timeout-ms: 5000
    default-read-timeout-ms: 15000
    upload:
      max-concurrent-chunks: 3
    facebook:
      enabled: true
      api-base: https://graph.facebook.com
      api-version: v22.0
      app-id: 1412048506810813
      app-secret: 5543ead87016a1ee8692248f662a1e30
      video-read-timeout-ms: 180000
    instagram:
      enabled: true
      api-base: https://graph.facebook.com
      api-version: v22.0
      video-container-max-wait-ms: 600000
      video-container-initial-poll-interval-ms: 2000
      video-container-max-poll-interval-ms: 30000
      video-container-poll-backoff-multiplier: 1.5
    tiktok:
      enabled: true
      api-base: https://open.tiktokapis.com
      api-version: v2
      pkce-enabled: false
      client-key: sbawkzswtdcg035vii
      client-secret: oqHjzuS6383LSvyTDqpXAknvp1yLyobK
      redirect-uri: https://social.hengzhanwujin.com/social/tiktok/callback
      default-privacy-level: PUBLIC_TO_EVERYONE
      scope: user.info.basic,user.info.profile,video.publish,video.upload
      photo-status-max-attempts: 15
      photo-status-poll-interval-ms: 2000
      video-status-max-attempts: 30
      video-status-poll-interval-ms: 3000
      webhook-signature-verify-enabled: true
      webhook-signature-tolerance-seconds: 300
      publish-reconcile-after-minutes: 5
      publish-reconcile-cron: "0 */10 * * * ?"
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  copywriting:
    templates:
      - locale: en
        content-type: social_post
        model: qwen-turbo
        system-prompt: You are a social media marketing assistant for African small-business sellers.
        user-template: "Write a short, friendly social media post about: {content}"
      - locale: sw
        content-type: social_post
        model: qwen-turbo
        system-prompt: Wewe ni msaidizi wa masoko kwa wachuuzi wadogo wa Afrika.
        user-template: "Andika chapisho fupi na la kirafiki kuhusu: {content}"
      - locale: en
        content-type: caption_generation
        model: qwen-turbo
        system-prompt: You write engaging captions for product photos and videos.
        user-template: "Write an engaging caption for this media: {media_url}"
      - locale: sw
        content-type: caption_generation
        model: qwen-turbo
        system-prompt: Wewe huandika maneno ya kuvutia kwa picha na video za bidhaa.
        user-template: "Andika maelezo ya kuvutia kwa midia hii: {media_url}"
