# Bootstrap-only config for a FRESH server before the first certbot run.
# After `sudo certbot --nginx -d social.hengzhanwujin.com` succeeds, replace
# this file with deploy/nginx-social.conf (full TLS version).
server {
    listen 80;
    server_name social.hengzhanwujin.com;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
    }
}