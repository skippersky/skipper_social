# KiliSocial test domain: static web on 18081, API on 18080.
# Full config with TLS. Certificate paths assume certbot has already issued
# a cert for social.hengzhanwujin.com (see deploy/nginx-social-http.conf for
# fresh-server bootstrap before the first certbot run).
# Install: sudo cp deploy/nginx-social.conf /etc/nginx/conf.d/social.hengzhanwujin.com.conf
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name social.hengzhanwujin.com;

    # Keep ACME http-01 challenges reachable for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name social.hengzhanwujin.com;

    ssl_certificate /etc/letsencrypt/live/social.hengzhanwujin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.hengzhanwujin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}